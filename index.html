<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Password</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style type="text/css">
        body{
            background: #002339;
            color: white;
        }
        .container{
            margin: 12%;
            width: 80%;
            max-width: 600px;
            
        }
        .display{
            margin-top: 5%;
            background-color: white;
            padding: 20px;
            /* width: 100%; */
            display: flex;
            justify-content: space-between;
            border-radius: 10px;
            margin-bottom: 5%;
        }
        h1{
            font-weight: 700;
            font-size: 45px;
        }
        h1 span{
            color: #019f55;
            border-bottom: 4px solid #019f55;
            padding-bottom: 1%;
        }
        .display span{
            font-size: 30px;
            cursor: pointer;
        }
        .display input{
            border: 0;
            outline: 0;
            font-size: 20px;
            font-weight: 600;
        }

    </style>
</head>

<body>


    <div class="container">
        <h1>Generate A <br> <span>Random Password</span> </h1>
        <div class="display">
            <input type="text" name="txtPassword" id="password" placeholder="Password">
            <span class="bi bi-copy text-success" id="copy" onclick="copyPassword()"></span>
        </div>
        <button id="btn-password" class="btn btn-success" onclick="createPassword()"><span class="bi bi-lightning-charge-fill"> </span>Generate Password</button>
    </div>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script type="text/javascript">
        var passwordBox = document.getElementById("password");
        // var button = document.getElementById("btn-password");
        // var copy = document.getElementById("copy");

        const length = 12;
        const upperCase = "QWERTYUIOPASDFGHJKLZXCVBNM";
        const lowerCase = "qwertyuiopasdfghjklzxcvbnm";
        const number = "1234567890";
        const symbol = "!@#$%^&*()[]{};'<.>/?_+-=";
        const allChars = upperCase + lowerCase + number + symbol;

        function createPassword(){
            let password = "";
            password += upperCase[Math.floor(Math.random() * upperCase.length)];
            password += lowerCase[Math.floor(Math.random() * lowerCase.length)]; 
            password += number[Math.floor(Math.random() * number.length)];
            password += symbol[Math.floor(Math.random() * symbol.length)];

            while(length > password.length){
                password += allChars[Math.floor(Math.random() * allChars.length)];
            }
            passwordBox.value = password;
        }

        function copyPassword() {
            passwordBox.select();
            document.execCommand("copy");
            passwordBox.value = "";
        }

    </script>

</body>

</html>
